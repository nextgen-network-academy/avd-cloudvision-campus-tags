---
### group_vars/DC1_FABRIC.yml

fabric_name: DC1_FABRIC

# Ansible connectivity definitions
# eAPI connectivity via HTTPS is specified (as opposed to network_cli via SSH)
ansible_connection: ansible.netcommon.httpapi
# Specifies that we are indeed using Arista EOS
ansible_network_os: arista.eos.eos
# This user/password must exist on the switches to enable Ansible access
ansible_user: admin
ansible_password: admin
# User escalation (to enter enable mode)
ansible_become: true
ansible_become_method: enable
# Use SSL (HTTPS)
ansible_httpapi_use_ssl: true
# Do not try to validate certs
ansible_httpapi_validate_certs: false

# CloudVision Portal definitions
cvp_instance_ips:
  - apiserver.arista.io
terminattr_smashexcludes: "ale,flexCounter,hardware,kni,pulse,strata"
terminattr_ingestexclude: "/Sysdb/cell/1/agent,/Sysdb/cell/2/agent"
terminattr_disable_aaa: true
terminattr_cvaddr: "apiserver.arista.io:443"
terminattr_cvauth: "token-secure,/tmp/cv-onboarding-token"
terminattr_cvvrf: MGMT
terminattr_taillogs: true

# Spine Switches
l3spine:
  defaults:
    platform: cEOSLab
    mgmt_interface: Management0
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    loopback_ipv4_pool: 172.16.1.0/24
    mlag_peer_ipv4_pool: 192.168.0.0/24
    mlag_peer_l3_ipv4_pool: 10.1.1.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
    mlag_interfaces: [Ethernet1, Ethernet2]
    campus: AVD_CAMPUS
    campus_pod: BUILDING_A
  node_groups:
    - group: SPINES
      cv_tags_topology_type: "spine"
      nodes:
        - name: SPINE1
          id: 1
          mgmt_ip: 192.168.101.13/24
          serial_number: 4C56530DDFA096503DE45DA4251BF1B4
        - name: SPINE2
          id: 2
          mgmt_ip: 192.168.101.14/24
          serial_number: A3A92F65104E86FE5CD98953DECB81AE

# IDF - Leaf Switches
l2leaf:
  defaults:
    platform: cEOSLab
    mgmt_interface: Management0
    mlag_peer_ipv4_pool: 192.168.0.0/24
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    inband_mgmt_subnet: 10.10.10.0/24
    inband_mgmt_vlan: 10
    campus: AVD_CAMPUS
    campus_pod: BUILDING_A
  node_groups:
    - group: IDF1
      cv_tags_topology_type: "leaf"
      campus_access_pod: IDF1
      mlag: true
      uplink_interfaces: [Ethernet1]
      mlag_interfaces: [Ethernet2, Ethernet3]
      filter:
        tags: [ "110", "120", "130" ]
      nodes:
        - name: LEAF1A
          id: 3
          mgmt_ip: 192.168.101.111/24
          uplink_switches: [SPINE1]
          uplink_switch_interfaces: [Ethernet3]
        - name: LEAF1B
          id: 4
          mgmt_ip: 192.168.101.112/24
          uplink_switches: [SPINE2]
          uplink_switch_interfaces: [Ethernet3]
    - group: IDF2
      cv_tags_topology_type: "leaf"
      campus_access_pod: IDF2
      uplink_interfaces: [Ethernet1,Ethernet2]
      mlag: false
      filter:
        tags: [ "210", "220", "230" ]
      nodes:
        - name: LEAF2A
          id: 5
          mgmt_ip: 192.168.101.113/24
          uplink_switches: [SPINE1, SPINE2]
          uplink_switch_interfaces: [Ethernet4]
    - group: IDF3_AGG
      cv_tags_topology_type: "leaf"
      campus_access_pod: IDF3
      mlag: true
      mlag_interfaces: [Ethernet3, Ethernet4]
      uplink_switches: [SPINE1, SPINE2]
      uplink_interfaces: [Ethernet1, Ethernet2]
      filter:
        tags: [ "310", "320", "330" ]
      nodes:
        - name: LEAF3A
          id: 6
          mgmt_ip: 192.168.101.114/24
          uplink_switch_interfaces: [Ethernet5, Ethernet5]
        - name: LEAF3B
          id: 7
          mgmt_ip: 192.168.101.115/24
          uplink_switch_interfaces: [Ethernet6, Ethernet6]
    - group: IDF3_3C
      cv_tags_topology_type: "member-leaf"
      campus_access_pod: IDF3
      mlag: false
      uplink_switches: [LEAF3A, LEAF3B]
      uplink_interfaces: [Ethernet1, Ethernet2]
      nodes:
        - name: LEAF3C
          id: 8
          mgmt_ip: 192.168.101.116/24
          uplink_switch_interfaces: [Ethernet5, Ethernet5]
    - group: IDF3_3D
      cv_tags_topology_type: "member-leaf"
      campus_access_pod: IDF3
      mlag: false
      uplink_switches: [LEAF3A, LEAF3B]
      uplink_interfaces: [Ethernet1, Ethernet2]
      nodes:
        - name: LEAF3D
          id: 9
          mgmt_ip: 192.168.101.117/24
          uplink_switch_interfaces: [Ethernet6, Ethernet6]
    - group: IDF3_3E
      cv_tags_topology_type: "member-leaf"
      campus_access_pod: IDF3
      mlag: false
      uplink_switches: [LEAF3A, LEAF3B]
      uplink_interfaces: [Ethernet1, Ethernet2]
      nodes:
        - name: LEAF3E
          id: 10
          mgmt_ip: 192.168.101.118/24
          uplink_switch_interfaces: [Ethernet7, Ethernet7]

#### Override for vEOS/cEOS Lab Caveats ####
p2p_uplinks_mtu: 1500

# Underlay Routing Protocol
underlay_routing_protocol: ospf

#### WAN/Core Edge Links ####
core_interfaces:
  p2p_links:
    - ip: [ 10.0.0.3/31, 10.0.0.2/31 ]
      nodes: [ SPINE1, WAN ]
      interfaces: [ Ethernet52/1, Ethernet1/1 ]
      include_in_underlay_protocol: true
    - ip: [ 10.0.0.5/31, 10.0.0.4/31 ]
      nodes: [ SPINE2, WAN ]
      interfaces: [ Ethernet52/1, Ethernet1/1 ]
      include_in_underlay_protocol: true